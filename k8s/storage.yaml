apiVersion: v1
kind: PersistentVolume
metadata:
  name: scsi-plex-config
spec:
  storageClassName: scsi-plex-config
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  iscsi:
    targetPortal: 10.0.30.1:3260
    iqn: iqn.2003-01.org.linux-iscsi.dullscythe.x8664:sn.97c0b77a4489
    lun: 0
    fsType: ext4
    readOnly: false
    chapAuthDiscovery: false
    chapAuthSession: false
    initiatorName: iqn.2003-01.org.linux-iscsi.dullscythe.client:kubes-plex
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scsi-plex-config
spec:
  storageClassName: scsi-plex-config
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
