# hooya-web-ui
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hooya-web-ui
  labels:
    app: hooya-web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hooya-web-ui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hooya-web-ui
    spec:
      containers:
        - image: ghcr.io/hooya-network/hooya-web-ui:v0.1.0
          # imagePullPolicy: Always
          name: hooya-web-ui
          env:
          - name: HOOYA_WEB_PROXY_URL
            value: http://10.0.40.128
          - name: HOOYA_WEB_PROXY_ENDPOINT
            value: http://10.0.40.128
      restartPolicy: Always
---
