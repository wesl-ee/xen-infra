apiVersion: apps/v1
kind: Deployment
metadata:
  name: hooyad
  labels:
    app: hooyad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hooyad
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hooyad
    spec:
      containers:
        - image: ghcr.io/hooya-network/hooyad:v0.1.0
          name: hooyad
          command: ["/hooyad", "--endpoint=0.0.0.0:8531", "--filestore=/mnt", "--db-uri=sqlite:///mnt/hooya.sqlite"]
          resources:
            requests:
              memory: "2Gi"
          volumeMounts:
            - mountPath: /mnt
              name: hooyad-mnt
              readOnly: false
      restartPolicy: Always
      volumes:
        - name: hooyad-mnt
          persistentVolumeClaim:
            claimName: hooyad-mnt
---
apiVersion: v1
kind: Service
metadata:
  name: hooyad
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.0.40.129
spec:
  selector:
    app: hooyad
  type: LoadBalancer
  externalTrafficPolicy: "Local"
  ports:
  - name: http
    port: 8531
    targetPort: 8531
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hooya-web-proxy
  labels:
    app: hooya-web-proxy
spec:
  replicas: 1
